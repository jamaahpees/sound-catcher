<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rekam Audio · Song Catcher</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="recorder">
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <span>Song Catcher</span>
      </div>
      <span class="pill" id="statusPill">Siap</span>
    </header>

    <main>
      <section class="timer-card">
        <p class="timer" id="timer">00:00</p>
        <div class="meter" id="meter" aria-hidden="true"></div>
        <p class="track" id="trackTitle">Belum ada audio</p>
        <p class="sub" id="trackArtist">Tekan Mulai Rekam, lalu pilih sumber audio.</p>
      </section>

      <section class="panel">
        <div class="row">
          <label for="format">Format</label>
          <select id="format">
            <option value="mp3">MP3</option>
            <option value="wav">WAV</option>
          </select>
        </div>
        <div class="row" id="bitrateRow">
          <label for="bitrate">Bitrate MP3</label>
          <select id="bitrate">
            <option value="128">128 kbps</option>
            <option value="192">192 kbps</option>
            <option value="256">256 kbps</option>
            <option value="320">320 kbps</option>
          </select>
        </div>
        <label class="check">
          <input type="checkbox" id="autoDownload" />
          <span>Unduh otomatis setelah stop</span>
        </label>
      </section>

      <button id="actionBtn" class="primary big">Mulai Rekam</button>

      <p class="hint" id="hint">
        Di jendela pemilih Chrome, pilih <b>Seluruh layar</b> atau <b>Jendela</b>, lalu
        centang <b>Bagikan audio sistem</b>. Tanpa centang itu, yang terekam hanya video
        tanpa suara.
      </p>

      <section class="result" id="result" hidden>
        <p class="result-title" id="resultName">Rekaman tersimpan</p>
        <p class="sub" id="resultMeta"></p>
        <div class="actions">
          <button id="downloadBtn" class="ghost">Unduh</button>
          <button id="newBtn" class="ghost">Rekam lagi</button>
        </div>
      </section>
    </main>

    <div id="notice" class="notice" role="status" hidden></div>

    <script type="module" src="recorder.js"></script>
  </body>
</html>
